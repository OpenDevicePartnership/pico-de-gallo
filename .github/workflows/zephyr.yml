on:
  push:
    branches: [main]
    paths:
      - "zephyr/**"
      - "crates/pico-de-gallo-ffi/**"
      - "crates/pico-de-gallo-internal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/zephyr.yml"
  pull_request:
    paths:
      - "zephyr/**"
      - "crates/pico-de-gallo-ffi/**"
      - "crates/pico-de-gallo-internal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/zephyr.yml"

# The Zephyr drivers are a consumer of pico-de-gallo-ffi: they call gallo_*
# through the cbindgen-generated header, linked by Corrosion at Zephyr build
# time. Before this workflow, an FFI change could break them while every other
# gate stayed green -- check.yml builds the FFI crate, which still compiles, and
# cbindgen regenerates the header without complaint, but nothing ever compiled
# the Zephyr translation unit that consumed the removed symbol.
#
# Two compile-time gates already existed in the tree and never fired:
# -Werror=switch over the Status-to-errno mapping in drivers/common/common.c,
# and the _Static_asserts pinning the mirrored FFI enums in
# tests/pdg_mfd_m5/common/m5_bottom.c. This workflow is what makes them fire.
#
# BUILD ONLY. Nothing here executes a produced binary. Runtime coverage needs an
# attached board and remains the manual zephyr/tests/pdg_mfd_m5/run-m5.sh
# procedure. A green run here means the module still compiles and links.
#
# Cargo.lock is in the path filter because zephyr/CMakeLists.txt imports the
# crate with corrosion_import_crate(... LOCKED), so a manifest/lock split breaks
# the Zephyr build too, not just check.yml's lockfile job.
name: zephyr

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned to the revision zephyr/README.md records as the measured baseline.
  # A step below fails the job if the two ever disagree.
  ZEPHYR_REVISION: 26f811ee9d0dc8f67e8e596f6aef9e6e79a55db0

jobs:
  selftest:
    # Exercises the assertion parsers against checked-in fixtures. Needs no
    # Zephyr workspace, so it fails in seconds rather than behind a
    # multi-gigabyte west checkout.
    runs-on: ubuntu-latest

    name: ubuntu / host / zephyr selftest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: ci-build.sh --self-test
        run: zephyr/scripts/ci-build.sh --self-test

  build:
    # Builds every target in the ci-build.sh table. Gated on selftest so a
    # broken parser does not burn a full west checkout first.
    needs: selftest

    runs-on: ubuntu-latest

    name: ubuntu / host / zephyr build

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
      ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
      # Shared so the nine builds do not each pay a full release build of
      # pico-de-gallo-ffi. If Corrosion overrides it, the only cost is time.
      CARGO_TARGET_DIR: /tmp/pdg-cargo-target

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Assert the pinned revision matches zephyr/README.md
        run: |
          if ! grep -qF "$ZEPHYR_REVISION" zephyr/README.md; then
            echo "zephyr/README.md does not record $ZEPHYR_REVISION" >&2
            echo "The workflow pin and the README must agree." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ninja-build gperf device-tree-compiler python3-venv libmagic1

      - name: Install west
        # A venv, not a bare pip install: ubuntu-latest ships a PEP 668
        # externally-managed Python, where `pip install west` hard-fails. This
        # also matches the setup zephyr/README.md documents.
        run: |
          python3 -m venv "$HOME/zephyr-venv"
          "$HOME/zephyr-venv/bin/pip" install --upgrade pip west
          echo "$HOME/zephyr-venv/bin" >> "$GITHUB_PATH"

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the west workspace
        id: west-cache
        uses: actions/cache@v4
        with:
          path: zephyrproject
          key: zephyr-ws-${{ env.ZEPHYR_REVISION }}-v1

      - name: Initialise the west workspace
        if: steps.west-cache.outputs.cache-hit != 'true'
        # `west init --mr` hands its argument to `git clone --branch`, which
        # accepts only a branch or tag name -- never an arbitrary commit SHA.
        # So clone blobless (every commit is present, blobs are lazy), detach
        # onto the pinned revision, then initialise the workspace around that
        # existing local manifest repo with `west init -l`. West takes the
        # manifest repo's parent as topdir, so topdir stays `zephyrproject`
        # and ZEPHYR_BASE remains correct. `west update` then resolves every
        # module at the revisions named in zephyr/west.yml as of that commit.
        run: |
          git clone --filter=blob:none \
            https://github.com/zephyrproject-rtos/zephyr zephyrproject/zephyr
          git -C zephyrproject/zephyr checkout --detach "$ZEPHYR_REVISION"
          west init -l zephyrproject/zephyr
          cd zephyrproject
          west update --narrow -o=--filter=blob:none

      - name: Install Zephyr Python dependencies
        working-directory: zephyrproject
        run: west packages pip --install

      - name: Report the Zephyr revision actually checked out
        working-directory: zephyrproject/zephyr
        run: |
          git --no-pager log -1 --format='%H %cI %s'
          test "$(git rev-parse HEAD)" = "$ZEPHYR_REVISION"

      - name: Build the Zephyr module
        working-directory: zephyrproject
        run: |
          "$GITHUB_WORKSPACE/zephyr/scripts/ci-build.sh" \
            --build-root /tmp/pdg-ci \
            --summary "$GITHUB_STEP_SUMMARY"

  twister:
    # Runs the twister scenarios declared by the seven tests.yaml files.
    #
    # This overlaps ci-build.sh and is deliberately the weaker of the two: it
    # has no equivalent of that script's two-sided translation-unit and Kconfig
    # assertions. It earns its place for two things ci-build.sh cannot do.
    #
    # First, twister forces CONFIG_COMPILER_WARNINGS_AS_ERRORS=y *and*
    # --edtlib-Werror (scripts/pylib/twister/twisterlib/runner.py, run_cmake()),
    # so devicetree BINDING warnings become build failures. This module ships
    # four custom bindings and a plain `west build` never checks them that way.
    #
    # Second, `type: unit` scenarios only run under twister -- it is what
    # selects BOARD=unit_testing. That is the vehicle for the hardware-free
    # helper coverage in #109.
    #
    # `needs: build` rather than `needs: selftest` purely so the west workspace
    # cache is already populated; the two jobs would otherwise both pay a cold
    # checkout and race to save the same key.
    needs: build

    runs-on: ubuntu-latest

    name: ubuntu / host / zephyr twister

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
      ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
      CARGO_TARGET_DIR: /tmp/pdg-cargo-target

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ninja-build gperf device-tree-compiler python3-venv libmagic1

      - name: Install west
        run: |
          python3 -m venv "$HOME/zephyr-venv"
          "$HOME/zephyr-venv/bin/pip" install --upgrade pip west
          echo "$HOME/zephyr-venv/bin" >> "$GITHUB_PATH"

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the west workspace
        id: west-cache
        uses: actions/cache@v4
        with:
          path: zephyrproject
          key: zephyr-ws-${{ env.ZEPHYR_REVISION }}-v1

      - name: Initialise the west workspace
        if: steps.west-cache.outputs.cache-hit != 'true'
        # Same shape as the build job; see the comment there for why this is a
        # detached clone rather than `west init --mr`.
        run: |
          git clone --filter=blob:none \
            https://github.com/zephyrproject-rtos/zephyr zephyrproject/zephyr
          git -C zephyrproject/zephyr checkout --detach "$ZEPHYR_REVISION"
          west init -l zephyrproject/zephyr
          cd zephyrproject
          west update --narrow -o=--filter=blob:none

      - name: Install Zephyr Python dependencies
        working-directory: zephyrproject
        run: west packages pip --install

      - name: Run twister
        working-directory: zephyrproject
        # The module is not in the west manifest, so twister does not read its
        # zephyr/module.yml and cannot discover the `samples:`/`tests:` roots on
        # its own. They are named explicitly with -T instead.
        #
        # EXTRA_ZEPHYR_MODULES is likewise not passed here. Every application's
        # own CMakeLists.txt appends the module root before find_package(Zephyr),
        # which is what makes the shield and the drivers resolve. That is the
        # same mechanism a bare `west build <dir>` relies on.
        #
        # Only native_sim/native/64 is named. `-p unit_testing` was tried and
        # removed: the unit_testing board cannot compile a driver translation
        # unit at all. cmake/modules/unittest.cmake supplies the generated
        # headers as file(TOUCH)ed EMPTY files, so syscall_macros.h is empty,
        # __syscall expands to nothing, and devicetree.h, ffs.h, bitarray.h and
        # mem_blocks.h all fail together the moment <zephyr/device.h> is pulled
        # in. syscalls/device.h is not even on that TOUCH list. That is why all
        # 14 suites under upstream tests/unit/ come from lib/, subsys/crc and
        # subsys/net/ip, and not one is a driver. Add it back only alongside a
        # `type: unit` suite that has been shown to build.
        #
        # --jobs 1 is load-bearing, not caution. Corrosion runs `cargo install
        # cbindgen` per build, and the builds share CARGO_TARGET_DIR above, so
        # concurrent installs race to copy /tmp/pdg-cargo-target/release/cbindgen
        # into their own prefix and one loses:
        #
        #   error: failed to copy `/tmp/pdg-cargo-target/release/cbindgen`
        #          to `.../corrosion/cbindgen/bin/cargo-install<rand>/cbindgen`
        #
        # Serialising is cheaper than the alternative. Dropping the shared
        # CARGO_TARGET_DIR would let the builds run in parallel, but each would
        # then compile pico-de-gallo-ffi and cbindgen from scratch; sharing the
        # directory means only the first build pays that cost.
        run: |
          west twister \
            --testsuite-root "$GITHUB_WORKSPACE/zephyr/samples" \
            --testsuite-root "$GITHUB_WORKSPACE/zephyr/tests" \
            --platform native_sim/native/64 \
            --outdir /tmp/pdg-twister \
            --jobs 1 \
            --inline-logs \
            --verbose

      - name: Upload the twister report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-report
          path: |
            /tmp/pdg-twister/twister.json
            /tmp/pdg-twister/twister.xml
          if-no-files-found: warn

