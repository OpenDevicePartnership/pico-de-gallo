name: Publish to crates.io

# Triggered by manually-pushed release tags (one tag per crate; see
# .github/RELEASE.md). Publishes the matching crate to crates.io with
# `cargo publish --locked`.
#
# Dependency-ordering note:
#   The library crates depend on each other:
#     internal  ──►  lib  ──►  hal
#                          └─►  ffi
#                          └─►  application (gallo)
#   When a maintainer cuts a coordinated multi-crate release, the tags
#   are typically pushed at roughly the same time and these jobs run in
#   parallel. crates.io takes 30-60 seconds to index a new publish, so
#   downstream publishes (lib/hal/ffi/application) can fail with
#   "no version of pico-de-gallo-internal X.Y.Z found in registry".
#   Push internal-v* first and wait for it to index, or re-run the
#   failed job once the upstream publish has indexed.
#
# Authentication:
#   Publishing uses crates.io Trusted Publishing (OIDC) — no API token is
#   stored in this repository. The job requests the `id-token: write`
#   permission, `rust-lang/crates-io-auth-action` exchanges the resulting
#   GitHub JWT for a short-lived crates.io token, and that action's `post`
#   step revokes the token when the job ends.
#
#   The matching publisher must be registered on crates.io for EACH of the
#   six crate names below (Trusted Publishing is configured per crate),
#   under Settings -> Trusted Publishing:
#     Repository owner:   OpenDevicePartnership
#     Repository name:    pico-de-gallo
#     Workflow filename:  release-crates.yml
#     Environment:        (blank)
#   The environment field is deliberately left blank; if you ever set it,
#   this job must declare a matching `environment:` block or auth fails.

on:
  push:
    tags:
      - "internal-v*"
      - "library-v*"
      - "hal-v*"
      - "ffi-v*"
      - "application-v*"
      - "mcp-v*"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest

    # Job-level permissions REPLACE the workflow-level block above rather
    # than merging with it, so `contents: read` is restated here.
    permissions:
      contents: read
      # Required to mint the OIDC JWT that crates.io exchanges for a
      # short-lived publish token.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine crate name from tag
        id: crate
        run: |
          case "${GITHUB_REF_NAME}" in
            internal-v*)    name="pico-de-gallo-internal" ;;
            library-v*)     name="pico-de-gallo-lib"      ;;
            hal-v*)         name="pico-de-gallo-hal"      ;;
            ffi-v*)         name="pico-de-gallo-ffi"      ;;
            application-v*) name="gallo"                  ;;
            mcp-v*)         name="gallo-mcp"             ;;
            *)
              echo "::error::Unrecognized tag: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Publishing crate: ${name}"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ${{ steps.crate.outputs.name }} --locked
