name: Publish to crates.io

# Triggered by manually-pushed release tags (one tag per crate; see
# .github/RELEASE.md). Publishes the matching crate to crates.io with
# `cargo publish --locked`.
#
# Dependency-ordering note:
#   The library crates depend on each other:
#     internal  ──►  lib  ──►  hal
#                          └─►  ffi
#                          └─►  application (gallo)
#   When a maintainer cuts a coordinated multi-crate release, the tags
#   are typically pushed at roughly the same time and these jobs run in
#   parallel. crates.io takes 30-60 seconds to index a new publish, so
#   downstream publishes (lib/hal/ffi/application) can fail with
#   "no version of pico-de-gallo-internal X.Y.Z found in registry".
#   Push internal-v* first and wait for it to index, or re-run the
#   failed job once the upstream publish has indexed.
#
# Token scope:
#   CARGO_REGISTRY_TOKEN must have `publish-update` scope, restricted to
#   the six crate names below. Do not grant `publish-new`; the crates
#   already exist. Exception: gallo-mcp is a NEW crate, so its FIRST
#   publish (the initial mcp-v* tag) needs `publish-new` scope once;
#   after it exists on crates.io, `publish-update` is sufficient.

on:
  push:
    tags:
      - "internal-v*"
      - "library-v*"
      - "hal-v*"
      - "ffi-v*"
      - "application-v*"
      - "mcp-v*"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine crate name from tag
        id: crate
        run: |
          case "${GITHUB_REF_NAME}" in
            internal-v*)    name="pico-de-gallo-internal" ;;
            library-v*)     name="pico-de-gallo-lib"      ;;
            hal-v*)         name="pico-de-gallo-hal"      ;;
            ffi-v*)         name="pico-de-gallo-ffi"      ;;
            application-v*) name="gallo"                  ;;
            mcp-v*)         name="gallo-mcp"             ;;
            *)
              echo "::error::Unrecognized tag: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Publishing crate: ${name}"

      - name: Publish to crates.io
        run: cargo publish -p ${{ steps.crate.outputs.name }} --locked
