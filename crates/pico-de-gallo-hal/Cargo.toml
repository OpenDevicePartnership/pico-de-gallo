[package]
name = "pico-de-gallo-hal"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
description = "embedded-hal and embedded-hal-async implementation for Pico de Gallo"
readme = "README.md"
categories = ["embedded", "hardware-support",]
keywords = ["embedded-hal", "embedded-hal-async", "pico-de-gallo"]
license = "MIT"
repository = "https://github.com/OpenDevicePartnership/pico-de-gallo"
documentation = "https://docs.rs/pico-de-gallo-hal"

# The UART trait impls are feature-gated per `embedded-io` major, so build
# the published docs with every feature on or half of them stay invisible.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["embedded-io-06"]
# Enabled by default for compatibility with existing consumers, but still separately selectable.
embedded-io-06 = ["dep:embedded-io-06", "dep:embedded-io-async-06"]
embedded-io-07 = ["dep:embedded-io-07", "dep:embedded-io-async-07"]

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-06 = { package = "embedded-io", version = "0.6.1", optional = true }
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6.1", optional = true }
embedded-io-07 = { package = "embedded-io", version = "0.7.1", optional = true }
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7.0", optional = true }
pico-de-gallo-lib = { version = "0.9.0", path = "../pico-de-gallo-lib" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
embedded-graphics = "0.8.2"
epd-waveshare = "0.6.0"
is31fl3743b-driver = { version = "0.1.1", features = ["is_blocking"] }
mpu6050-dmp = "0.6.1"
shtcx = "1.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time", "macros"] }
