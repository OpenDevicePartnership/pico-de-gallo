[package]
name = "gallo-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Model Context Protocol server exposing a Pico de Gallo device to AI agents"
readme = "README.md"
categories = ["development-tools", "command-line-utilities"]
keywords = ["mcp", "pico-de-gallo", "agent", "embedded"]
license = "MIT"
repository = "https://github.com/OpenDevicePartnership/pico-de-gallo"
documentation = "https://docs.rs/gallo-mcp"

[dependencies]
pico-de-gallo-lib = { version = "0.7.1", path = "../pico-de-gallo-lib" }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
