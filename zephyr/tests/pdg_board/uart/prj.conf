CONFIG_SERIAL=y
CONFIG_LOG=y

# Both are `default y` once the matching devicetree node is enabled, so
# app.overlay alone would turn them on. Stated explicitly for the same reason
# samples/uart_bridge/prj.conf states them: a reader should not have to derive
# the driver symbol from a DT_HAS_* dependency in drivers/serial/Kconfig.
CONFIG_MFD_PICO_DE_GALLO=y
CONFIG_UART_PICO_DE_GALLO=y

# LOAD-BEARING, unlike in samples/uart_bridge, which never calls either entry
# point. pdg_uart.c wraps .configure and .config_get in
# `#ifdef CONFIG_UART_USE_RUNTIME_CONFIGURE` (see the api struct near the end of
# the driver), and uart_configure()/uart_config_get() return -ENOSYS when the
# slots are NULL. This application exists to exercise exactly those two calls,
# so the symbol is asserted here rather than left to its Kconfig default.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Deliberately NOT set: CONFIG_EARLY_CONSOLE, for the reason samples/uart_bridge
# documents -- the Pico de Gallo UART initialises at POST_KERNEL while the early
# console hook installs at PRE_KERNEL_1.
#
# Also deliberately NOT set: CONFIG_UART_ASYNC_API and
# CONFIG_UART_INTERRUPT_DRIVEN. This application drives the polling API only.
