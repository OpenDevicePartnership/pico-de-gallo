CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_I2C=y

# GPIO and SPI are disabled in burst.overlay; stated explicitly so an accidental
# re-enable is visible in review. This image has no reason to actuate a pin.
CONFIG_GPIO=n
CONFIG_SPI=n

# No sensor driver is bound to the target. The test issues raw i2c_* calls
# because the subject is the controller's message-group handling, which a
# sensor driver would hide behind its own register accesses.
CONFIG_SENSOR=n

# The oversize-rejection case needs two static PDG_I2C_MAX_BUFFER-sized
# payloads, which live in .bss and not on this stack. The default main stack is
# nonetheless raised for headroom, matching tests/pdg_mfd_m5/acceptance.
CONFIG_MAIN_STACK_SIZE=8192

# CONFIG_HEAP_MEM_POOL_ADD_SIZE_PDG_I2C is deliberately NOT set here.
#
# The I2C driver k_mallocs a merge buffer for a group holding two or more
# non-empty writes, and declares its own additive heap contribution (default
# 8192) in zephyr/drivers/i2c/Kconfig. This image's largest successful gather is
# three bytes. Leaving the default alone is therefore part of the coverage: if
# the driver ever stopped declaring that symbol, this test would fail to link
# with an undefined reference to k_malloc, which is exactly how #111 presented
# for the SPI driver.
