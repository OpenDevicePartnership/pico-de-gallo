CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_SPI=y

# pdg_spi.c BUILD_ASSERTs both of these off: it implements neither
# transceive_async() nor iodev_submit(). Stated explicitly rather than relied on
# as a default, because CONFIG_SENSOR_ASYNC_API selects SPI_RTIO transitively.
CONFIG_SPI_ASYNC=n
CONFIG_SPI_RTIO=n

# T5's largest live case is the 1013-byte TX-only ceiling transfer; the
# 4096-byte historical control (--payload-before-only) is larger still, and the
# ceiling sweep probes up to 4096. Both static payload buffers are 4096 and live
# in .bss.
CONFIG_MAIN_STACK_SIZE=8192

# Application-side heap, NOT a driver change.
#
# pdg_spi_transceive() k_mallocs one flattened buffer per direction, each of
# clock_len bytes. The live T5 cases need very little: 1013 TX-only (T5a) and
# 512 duplex (T5e) allocate at most 2 x 1013, which the driver's own additive
# contribution (CONFIG_HEAP_MEM_POOL_ADD_SIZE_PDG_SPI, default 8192) covers many
# times over.
#
# The binding requirement is the acceptance spec §4.1 historical control, which
# transfers 4096 bytes and therefore allocates 2 x 4096 = 8192 exactly. At the
# 8192 default the SECOND k_malloc would fail -ENOMEM at pdg_spi.c:466 and
# destroy the control: the expected reading there is -ECOMM from the transport,
# and an -ENOMEM would look like "the premise did not reproduce" when in fact
# the call never left the host. The same applies to the ceiling sweep's upper
# probes. The kernel takes the maximum of CONFIG_HEAP_MEM_POOL_SIZE and the sum
# of the HEAP_MEM_POOL_ADD_SIZE_* symbols, so raising it here affects this
# application only and perturbs no other M5 image and no production default.
CONFIG_HEAP_MEM_POOL_SIZE=16384

