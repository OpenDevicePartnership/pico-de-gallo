#
# Phase of the manual M5 procedure driven by zephyr/tests/pdg_mfd_m5/run-m5.sh.
# See zephyr/tests/pdg_i2c_burst/tests.yaml for why build_only is mandatory, why
# a fixture gate was rejected, and why the overlay must be named explicitly.
#
# This is the target whose translation unit carries the _Static_asserts pinning
# the mirrored FFI enum discriminants (zephyr/tests/pdg_mfd_m5/common/m5_bottom.c,
# and AGENTS.md 15.1). Building it is what makes them fire.
common:
  build_only: true
  tags:
    - drivers
    - gpio
    - spi
    - pico_de_gallo
tests:
  drivers.pico_de_gallo.mfd.m5.acceptance:
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    extra_dtc_overlay_files:
      - acceptance.overlay
