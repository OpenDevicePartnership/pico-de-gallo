#
# M5 phase 4 -- fragment applied on top of the upstream spi_loopback prj.conf.
#
# The executor appends a second, generated fragment carrying only the measured
# timing multiplier (/tmp/m5-measured.conf). Execution never rewrites a tracked
# config file.

# MANDATORY. pdg_spi.c:58-63 BUILD_ASSERTs both of these off: the driver
# implements neither transceive_async() nor iodev_submit(), and Zephyr's SPI
# subsystem dispatches both straight through the driver API with no NULL check,
# so enabling either would turn async use into a jump through a NULL function
# pointer. With SPI_ASYNC off, the suite's async cases at spi.c:936, :971 and
# :1019 are NOT BUILT -- that is the expected disposition, not a gap.
CONFIG_SPI_ASYNC=n
CONFIG_SPI_RTIO=n

# spi.c:95 sets BUF3_SIZE from this and :605-611 transfers exactly that many
# bytes FULL DUPLEX.
#
# The measured ceiling is 1013 bytes, but that is a TX-ONLY result. Full duplex
# has never been measured at any length that works: the only duplex data point
# is 3072, which fails -ECOMM. Setting this at or near 1013 would therefore be
# betting on an unmeasured shape, in the single most conspicuous case in the
# suite, where a failure presents as a data-path defect rather than a
# configuration one.
#
# 512 is chosen for margin, not for coverage: roughly half the measured TX-only
# ceiling, and far away from the 1015-byte length that hangs the firmware
# dispatcher device-wide. It is also a size this case does not actually need to
# be large for -- test_spi_complete_large_transfers exercises the driver's
# flatten/unflatten offset arithmetic over a multi-buffer transfer, and that
# arithmetic is size-independent.
#
# Raise this only after full duplex has been measured, and keep it strictly
# below the measured duplex ceiling.
CONFIG_SPI_LARGE_BUFFER_SIZE=512

# Allocator headroom for test_spi_complete_large_transfers.
#
# Full duplex allocates two CONFIG_SPI_LARGE_BUFFER_SIZE-byte buffers
# (pdg_spi.c:457 and :464), i.e. 2 x 512 at the value set above. The driver's
# own CONFIG_HEAP_MEM_POOL_ADD_SIZE_PDG_SPI default of 8192 already covers that
# with a very large margin.
#
# It is stated explicitly here anyway, at the point of consumption, because an
# allocation failure in this case does not present as a configuration problem:
# -ENOMEM is logged at pdg_spi.c:466 and the suite's wrapper at spi.c:259-263
# converts only -EINVAL and -ENOTSUP to a skip, so it falls through to
# zassert_ok() and reads as a data-path defect in the most conspicuous case in
# the suite.
CONFIG_HEAP_MEM_POOL_SIZE=8192
