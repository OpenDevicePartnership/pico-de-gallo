CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y

# SPI is disabled in jumper.overlay; stated explicitly so an accidental
# re-enable is visible in review. An enabled SPI controller would park pin 2 as
# an inactive output at init and invalidate every reading in this phase.
CONFIG_SPI=n
