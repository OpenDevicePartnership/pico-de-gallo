CONFIG_ZTEST=y
CONFIG_SERIAL=y
CONFIG_MFD_PICO_DE_GALLO=y
CONFIG_UART_PICO_DE_GALLO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Every explicit PDG callback slot must exist in the binary, or a test that
# invokes it would be asserting on a Zephyr wrapper's -ENOTSUP shortcut rather
# than on this driver.
#
#   UART_USE_RUNTIME_CONFIGURE  gates .configure / .config_get
#   UART_ASYNC_API              gates the five byte async stubs
#   UART_WIDE_DATA              gates .poll_out_u16 and the three wide stubs
#   IRQ_OFFLOAD                 supplies real ISR context for the refusal
#                               matrix; it depends on TEST, which ZTEST selects
#
# pdg_uart.c deliberately does NOT select SERIAL_SUPPORT_ASYNC or
# SERIAL_SUPPORT_WIDE_DATA -- it ships those stubs precisely because another
# driver in the same image can turn the global API on. Here that other driver is
# native_sim's own PTY UART, which selects SERIAL_SUPPORT_ASYNC;
# UART_WIDE_DATA has no support-symbol dependency, and the POSIX architecture
# implements arch_irq_offload().
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_WIDE_DATA=y
CONFIG_IRQ_OFFLOAD=y

# Deliberately NOT set: CONFIG_ZTEST_SHUFFLE.
#
# This suite is order-dependent by design, not by accident. The driver's
# transport latch is permanent for the device lifetime and there is no
# re-arming hook -- adding one would be a forbidden production change -- so the
# dedicated uart_rx_latch and uart_tx_latch instances are consumed exactly once.
# Shuffling would not test independence; it would invalidate the ownership
# assumptions that make the five-instance topology safe.

# Deliberately NOT set: CONFIG_EARLY_CONSOLE. pdg_uart.c carries an
# instance-scoped BUILD_ASSERT rejecting an early console on a chosen PDG UART,
# and this suite has no reason to approach that.

# Disabled in fake.overlay; stated explicitly so an accidental re-enable is
# visible in review, matching the convention in the other test prj.conf files.
# These are not cosmetic here: the fake overrides no GPIO/I2C/SPI bottom
# function, so an enabled sibling would send its opaque token into the real FFI.
CONFIG_GPIO=n
CONFIG_I2C=n
CONFIG_SPI=n
