#
# SPIKE -- throwaway. See main.c for what this is probing and why.
#
# `type: unit` is what selects BOARD=unit_testing; twister sets it, a plain
# `west build` cannot. No platform_allow: type: unit scenarios are matched to
# the unit_testing platform, and naming native_sim here would contradict that.
#
# No build_only either. Unlike every other tests.yaml in this module, this one
# is MEANT to run -- it needs no board, because unit_testing links nothing that
# reaches gallo_init_strict().
tests:
  drivers.pico_de_gallo.i2c.msgs_unit:
    type: unit
    tags:
      - drivers
      - i2c
      - pico_de_gallo
