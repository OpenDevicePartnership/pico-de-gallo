description: |
  Pico de Gallo USB-attached SPI controller.

  This controller forwards Zephyr SPI API calls to a Pico de Gallo USB bridge
  connected to the host running native_sim. Devices on the bus are declared as
  ordinary child nodes using their own vendor,device compatible.

compatible: "odp,pico-de-gallo-spi"

include: spi-controller.yaml

properties:
  serial-number:
    type: string
    description: |
      Optional USB serial number selecting the physical Pico de Gallo board
      that backs this controller. Devicetree authors must use the same value
      on every Pico de Gallo controller node, such as I2C and SPI, that accesses
      the same board. Those controllers then share one USB connection
      internally; application code can use the normal Zephyr controller APIs
      without managing that connection. Different values select different
      physical boards.

      If omitted, the first matching board is selected. Every controller node
      intended to share that default board must also omit this property. Do not
      mix omitted and explicit selectors for the same board.
