CONFIG_SERIAL=y
CONFIG_LOG=y

# Both of these are `default y` once the matching devicetree node is enabled,
# so app.overlay alone would turn them on. They are stated explicitly because
# this sample exists to document the UART path: a reader should not have to
# derive the driver symbol from a DT_HAS_* dependency in drivers/serial/Kconfig.
CONFIG_MFD_PICO_DE_GALLO=y
CONFIG_UART_PICO_DE_GALLO=y

# Deliberately NOT set: CONFIG_EARLY_CONSOLE. The Pico de Gallo UART
# initialises at POST_KERNEL, while the early console hook installs at
# PRE_KERNEL_1 and checks device readiness, so the driver rejects the
# combination at build time when it is also zephyr,console. This sample never
# makes it the console, but leaving the symbol off keeps the example honest.
