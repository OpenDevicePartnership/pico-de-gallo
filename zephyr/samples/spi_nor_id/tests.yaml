sample:
  name: Pico de Gallo SPI NOR ID
  description: Read the JEDEC ID of a SPI NOR flash behind a Pico de Gallo bridge
common:
  build_only: true
  tags:
    - spi
    - flash
    - shield
    - pico_de_gallo
tests:
  sample.pico_de_gallo.spi_nor_id:
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
