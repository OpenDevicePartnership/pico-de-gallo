CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_LOG=y

# native_sim enables a simulated flash by default, which would put a second
# flash device in the image and drop a 2 MiB flash.bin in the source tree.
# Turn it off so the only flash present is the real part behind the bridge.
CONFIG_FLASH_SIMULATOR=n
